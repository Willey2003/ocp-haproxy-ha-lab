# /etc/sysctl.d/90-ocp-lb.conf  (both load balancers)
# Let HAProxy bind the keepalived VIP even on the node that does not hold it,
# so a failover never needs an HAProxy restart.
net.ipv4.ip_nonlocal_bind = 1
# Deeper accept queue for API and ingress bursts.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# keepalived for lb1 (MASTER). Copy to /etc/keepalived/keepalived.conf.
# The two LB configs differ only in router_id, state, priority and the
# unicast source/peer addresses. All IPs are lab placeholders.

global_defs {
    router_id lb1
    enable_script_security
    script_user root
    # Re-send gratuitous ARP periodically while MASTER so switches and
    # hosts never keep a stale MAC for the VIP.
    vrrp_garp_master_refresh 60
    vrrp_garp_master_repeat 3
}

vrrp_script chk_haproxy {
    script "/etc/keepalived/check_haproxy.sh"
    interval 2      # run every 2s
    timeout 3
    fall 2          # 2 failures (~4s) -> FAULT, VIP moves to peer
    rise 2
}

vrrp_instance VI_OCP {
    state MASTER
    interface ens192              # CHANGE ME: NIC on the node network
    virtual_router_id 51          # must be unique on this L2 segment
    priority 150
    advert_int 1

    # Unicast VRRP: works on VMware/cloud networks that filter multicast.
    unicast_src_ip 192.168.100.11
    unicast_peer {
        192.168.100.12
    }

    authentication {
        auth_type PASS
        auth_pass Ch4ngeMe          # CHANGE ME: max 8 chars, same on both LBs
    }

    virtual_ipaddress {
        192.168.100.10/24 dev ens192 label ens192:vip
    }

    track_script {
        chk_haproxy
    }

    notify /etc/keepalived/notify.sh
}

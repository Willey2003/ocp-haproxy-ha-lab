#---------------------------------------------------------------------
# HAProxy for Red Hat OpenShift (UPI / user-managed load balancer)
#
# Deployed identically on lb1 and lb2. keepalived moves the VIP
# (192.168.100.10) between them; HAProxy binds to the VIP on both nodes,
# which needs net.ipv4.ip_nonlocal_bind=1 (prep/sysctl/90-ocp-lb.conf).
#
#   VIP        192.168.100.10   api / api-int / *.apps all resolve here
#   master0    192.168.100.21
#   master1    192.168.100.22
#   master2    192.168.100.23
#   infra0     192.168.100.31
#   infra1     192.168.100.32
#   bootstrap  192.168.100.20   (install time only)
#
# All IPs are lab placeholders. Replace them before deploying.
#---------------------------------------------------------------------

global
    log         /dev/log local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    user        haproxy
    group       haproxy
    daemon
    maxconn     40000

    # Runtime API: used by the failover runbook to drain/enable servers,
    # e.g. echo "disable server api_backend/master0" | socat stdio /var/lib/haproxy/stats
    stats socket /var/lib/haproxy/stats mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  log-health-checks
    option                  redispatch
    retries                 3
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout queue           1m
    timeout check           10s
    maxconn                 20000
    # Health checks: check every 2s, 3s while down; 2 fails = down, 3 passes = up
    default-server          inter 2s downinter 3s fall 2 rise 3

#---------------------------------------------------------------------
# Stats page (port 9000, bound on all addresses so each LB can be
# inspected individually). Firewall restricts it to the mgmt network.
#   http://<lb-or-vip>:9000/stats     (basic auth below)
#   http://127.0.0.1:9000/healthz     (liveness, used by keepalived)
#---------------------------------------------------------------------
listen stats
    bind            *:9000
    mode            http
    log             global
    option          httplog
    timeout client  30s
    timeout server  30s
    stats enable
    stats uri       /stats
    stats refresh   10s
    stats show-legends
    stats show-node
    stats realm     HAProxy\ Statistics
    # Unauthenticated liveness endpoint for keepalived's check script;
    # answered before the stats auth below applies.
    monitor-uri     /healthz
    # CHANGE ME: placeholder credentials
    stats auth      admin:changeme
    # Allow drain/enable from the web UI only for authenticated users
    stats admin     if TRUE

#---------------------------------------------------------------------
# Prometheus exporter (port 8405, mgmt network only via firewall)
#   http://<lb>:8405/metrics
#---------------------------------------------------------------------
frontend prometheus
    bind            *:8405
    mode            http
    timeout client  30s
    option          httplog
    # scrapes every few seconds would flood the log
    http-request set-log-level silent
    http-request use-service prometheus-exporter if { path /metrics }

#---------------------------------------------------------------------
# Kubernetes API server  (api.<cluster>.<domain> and api-int)
#---------------------------------------------------------------------
frontend api
    bind            192.168.100.10:6443
    description     OpenShift API server
    default_backend api_backend

backend api_backend
    balance         roundrobin
    # Watches are long-lived; keep established tunnels open.
    timeout tunnel  1h
    # kube-apiserver answers /readyz with 200 only when it can serve traffic,
    # and flips to 500 during graceful shutdown so HAProxy drains it first.
    option          httpchk
    http-check      connect ssl
    http-check      send meth GET uri /readyz ver HTTP/1.1 hdr Host api-int
    http-check      expect status 200
    # server bootstrap 192.168.100.20:6443 check check-ssl verify none   # install only, remove after bootstrap-complete
    server master0 192.168.100.21:6443 check check-ssl verify none
    server master1 192.168.100.22:6443 check check-ssl verify none
    server master2 192.168.100.23:6443 check check-ssl verify none

#---------------------------------------------------------------------
# Machine Config Server  (api-int only; nodes fetch ignition here)
#---------------------------------------------------------------------
frontend machine_config
    bind            192.168.100.10:22623
    description     OpenShift Machine Config Server
    default_backend machine_config_backend

backend machine_config_backend
    balance         roundrobin
    # MCS is TLS; a TCP connect check is enough to confirm it is listening.
    # server bootstrap 192.168.100.20:22623 check   # install only, remove after bootstrap-complete
    server master0 192.168.100.21:22623 check
    server master1 192.168.100.22:22623 check
    server master2 192.168.100.23:22623 check

#---------------------------------------------------------------------
# Ingress (*.apps) -> OpenShift routers on the 2 infra nodes
# TLS is passed through untouched; the routers terminate it.
#---------------------------------------------------------------------
frontend ingress_https
    bind            192.168.100.10:443
    description     OpenShift ingress HTTPS
    default_backend ingress_https_backend

backend ingress_https_backend
    balance         source
    hash-type       consistent
    timeout tunnel  1h
    # Router readiness endpoint on the host network (port 1936). It goes
    # unready before the router stops, so drains are clean on upgrades.
    option          httpchk GET /healthz/ready HTTP/1.0
    http-check      expect status 200
    server infra0 192.168.100.31:443 check port 1936
    server infra1 192.168.100.32:443 check port 1936

frontend ingress_http
    bind            192.168.100.10:80
    description     OpenShift ingress HTTP
    default_backend ingress_http_backend

backend ingress_http_backend
    balance         source
    hash-type       consistent
    timeout tunnel  1h
    option          httpchk GET /healthz/ready HTTP/1.0
    http-check      expect status 200
    server infra0 192.168.100.31:80 check port 1936
    server infra1 192.168.100.32:80 check port 1936

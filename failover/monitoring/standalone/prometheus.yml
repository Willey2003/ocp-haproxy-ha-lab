# Standalone Prometheus for a host OUTSIDE the cluster (e.g. the bastion).
# It keeps alerting when the cluster, and its own monitoring, is unreachable.
# Edit the LB IPs and hostnames to match lab.env.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/lb.rules.yml
  - /etc/prometheus/rules/vip-probe.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: haproxy
    static_configs:
      - targets: ["192.168.100.11:8405", "192.168.100.12:8405"]

  - job_name: lb-node
    static_configs:
      - targets: ["192.168.100.11:9100", "192.168.100.12:9100"]

  # Probes each endpoint through the VIP by name, the way clients reach it.
  - job_name: vip-probe
    metrics_path: /probe
    scrape_interval: 10s
    static_configs:
      - targets: ["https://api.ocp.lab.example.com:6443/readyz"]
        labels: { endpoint: api, __param_module: http_readyz }
      - targets: ["https://api-int.ocp.lab.example.com:22623/healthz"]
        labels: { endpoint: machine-config-server, __param_module: http_2xx_nobody }
      - targets: ["https://canary-openshift-ingress-canary.apps.ocp.lab.example.com/"]
        labels: { endpoint: ingress-https, __param_module: http_2xx_insecure }
      - targets: ["api.ocp.lab.example.com:6443"]
        labels: { endpoint: api-tcp, __param_module: tcp_tls }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
